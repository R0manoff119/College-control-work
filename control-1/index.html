<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Практика JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Практическая работа</h1>

    <h2>Счётчик</h2>
    <p id="number">Количество: 0</p>
    <button onclick="changeNumber()">Нажать</button>

    <h2>Изменение цвета</h2>
    <div id="box"></div>

    <h2>Клавиатура</h2>
    <p id="keyboard">Клавиша не нажата</p>

    <h2>Перемещение квадрата</h2>
    <div id="field">
        <div id="player"></div>
    </div>

    <button onclick="clearAll()">Очистить</button>

    <script src="script.js"></script>
</body>
</html>
